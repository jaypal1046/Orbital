name: 🐛 Bug Report
description: File a bug report for Orbital Android app or MCP bridge
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible.

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - "Android Companion App"
        - "Orbital MCP Bridge Server (Node.js)"
        - "IDE Integration (Antigravity, Cursor, Claude)"
        - "Foreground Overlay & Mascot"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step guide to reproduce the issue.
      placeholder: |
        1. Open Orbital app
        2. Pair with Laptop AI Bridge
        3. Execute batch task...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen under normal operation.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Telemetry Output
      description: Paste relevant terminal logs or error tracebacks here.
      render: shell
