name: ✨ Feature Request
description: Propose a new feature, MCP tool, or capability for Orbital
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We love new ideas! Describe your proposed feature and how it improves mobile AI automation.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of the problem (e.g. "I'm always frustrated when...").
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
