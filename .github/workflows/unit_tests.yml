name: 🧪 Orbital Automated Test Suite & CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: 🔬 Android Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🔧 Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🚀 Run Android JVM Unit Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: 📊 Upload Test Results Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/

  mcp-bridge-tests:
    name: 🛰️ Orbital MCP Bridge Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'tools/orbital-mcp/package-lock.json'

      - name: 📦 Install MCP Bridge Dependencies
        run: cd tools/orbital-mcp && npm ci

      - name: 🚀 Validate MCP Bridge Package
        working-directory: tools/orbital-mcp
        run: |
          node --check index.js
          npm pack --dry-run
